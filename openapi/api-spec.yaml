openapi: "3.0.3"
info:
  version: 1.0.0
  title: NoteTaker API
  description: >
    NoteTaker5000 - a lightweight note-taking service shared amongst small teams.
    Users capture their work as notes, mark them complete, and can share notes with
    other users. All endpoints require a valid Bearer JWT issued by a trusted issuer
    (the FIT-UI OKTA issuer for real users, or the self/bypass issuer for tests).
servers:
  - url: https://notetaker-{environment}.example.com
    description: Direct service hostname
    variables:
      environment:
        enum:
          - development
          - release
        default: release
        description: Application environment
tags:
  - name: V1Notes
    description: V1 Notes API - create, read, update, complete, delete and share notes
paths:
  /api/v1/notes:
    $ref: "./paths/notes.yaml"
  /api/v1/notes/{id}:
    $ref: "./paths/note-by-id.yaml"
  /api/v1/notes/{id}/complete:
    $ref: "./paths/note-complete.yaml"
  /api/v1/notes/{id}/shares:
    $ref: "./paths/note-shares.yaml"
  /api/v1/notes/{id}/shares/{userId}:
    $ref: "./paths/note-share-by-user.yaml"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jwt
