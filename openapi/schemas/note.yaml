Note:
  type: object
  description: A note that lives inside a collaborative workspace
  required:
    - id
    - workspaceId
    - title
    - completed
    - createdByUserId
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the note
      example: 1024
    workspaceId:
      type: integer
      format: int64
      description: Identifier of the workspace the note belongs to
      example: 12
    title:
      type: string
      example: "Dock 12 inspection follow-up"
    content:
      type: string
      example: "Re-check pallet wrap on HU 4471 before release."
    completed:
      type: boolean
      description: True when a member has marked the note complete
      example: false
    createdByUserId:
      type: integer
      format: int64
      description: Identifier of the user who created the note
      example: 55
    createdAt:
      type: string
      format: date-time
      example: "2026-09-28T15:04:05Z"
    updatedAt:
      type: string
      format: date-time
      example: "2026-09-28T15:04:05Z"
    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: When the note was moved to the trash; absent while active
      example: "2026-09-29T08:00:00Z"

CreateNoteRequest:
  type: object
  required:
    - workspaceId
    - title
  properties:
    workspaceId:
      type: integer
      format: int64
      description: Workspace the note will be created in; the caller must be an owner or editor
      example: 12
    title:
      type: string
      minLength: 1
      maxLength: 200
      example: "Dock 12 inspection follow-up"
    content:
      type: string
      maxLength: 20000
      example: "Re-check pallet wrap on HU 4471 before release."

UpdateNoteRequest:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      example: "Dock 12 inspection follow-up (resolved)"
    content:
      type: string
      maxLength: 20000
      example: "Pallet re-wrapped and released at 14:05."
    completed:
      type: boolean
      description: Optionally set the completed state while updating the note
      example: true
