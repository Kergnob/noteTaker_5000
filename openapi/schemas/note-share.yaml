SharePermission:
  type: string
  description: Access level granted to the user a note is shared with
  enum:
    - READ
    - WRITE
  example: "READ"

NoteShare:
  type: object
  required:
    - noteId
    - sharedWithUserId
    - permission
    - createdAt
  properties:
    noteId:
      type: string
      example: "3f2a9c6e-1b7d-4c2e-9a55-8e0f1d2c3b4a"
    sharedWithUserId:
      type: string
      example: "123456"
    permission:
      $ref: "#/SharePermission"
    createdAt:
      type: string
      format: date-time
      example: "2026-09-28T15:10:00Z"

ShareNoteRequest:
  type: object
  required:
    - sharedWithUserId
  properties:
    sharedWithUserId:
      type: string
      minLength: 1
      description: Identifier of the user to share the note with
      example: "123456"
    permission:
      $ref: "#/SharePermission"

NoteSharesResponse:
  type: object
  required:
    - shares
  properties:
    shares:
      type: array
      items:
        $ref: "#/NoteShare"
