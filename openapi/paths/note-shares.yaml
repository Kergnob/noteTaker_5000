get:
  operationId: listNoteShares
  summary: List the users a note is shared with (owner only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: string
  responses:
    '200':
      description: The shares for the note
      content:
        application/json:
          schema:
            $ref: "../schemas/note-share.yaml#/NoteSharesResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: Only the owner may view the shares
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
post:
  operationId: shareNote
  summary: Share a note with another user (owner only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/note-share.yaml#/ShareNoteRequest"
        example:
          sharedWithUserId: "123456"
          permission: "READ"
  responses:
    '201':
      description: The created share
      content:
        application/json:
          schema:
            $ref: "../schemas/note-share.yaml#/NoteShare"
    '400':
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: Only the owner may share the note
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
