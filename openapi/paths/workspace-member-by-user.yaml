delete:
  operationId: removeWorkspaceMember
  summary: Remove a member from a workspace (owner only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Workspaces
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the workspace
      schema:
        type: integer
        format: int64
    - name: userId
      in: path
      required: true
      description: Identifier of the member to remove
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: Member removed
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: Only an owner may remove members, or the last owner cannot be removed
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: The user is not a member of this workspace
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
