get:
  operationId: listWorkspaceMembers
  summary: List the members of a workspace (any member may view)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Workspaces
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the workspace
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The workspace members
      content:
        application/json:
          schema:
            $ref: "../schemas/workspace.yaml#/WorkspaceMembersResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: The caller is not a member of this workspace
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
post:
  operationId: addWorkspaceMember
  summary: Add or update a member of a workspace (owner only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Workspaces
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the workspace
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/workspace.yaml#/AddMemberRequest"
  responses:
    '200':
      description: The role of an already-existing member was updated
      content:
        application/json:
          schema:
            $ref: "../schemas/workspace.yaml#/WorkspaceMember"
    '201':
      description: A new member was added to the workspace
      content:
        application/json:
          schema:
            $ref: "../schemas/workspace.yaml#/WorkspaceMember"
    '400':
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: Only an owner may manage members
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
