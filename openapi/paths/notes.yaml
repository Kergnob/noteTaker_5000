get:
  operationId: listNotes
  summary: List active notes in workspaces the caller belongs to
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: workspaceId
      in: query
      required: false
      description: Restrict results to a single workspace the caller belongs to
      schema:
        type: integer
        format: int64
    - name: pageNumber
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    - name: itemsPerPage
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    - name: searchTerm
      in: query
      required: false
      description: Optional case-insensitive filter applied to the note title
      schema:
        type: string
  responses:
    '200':
      description: A page of notes
      content:
        application/json:
          schema:
            $ref: "../schemas/notes-response.yaml#/NotesResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
post:
  operationId: createNote
  summary: Create a new note in a workspace (owner or editor only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/note.yaml#/CreateNoteRequest"
  responses:
    '201':
      description: The created note
      content:
        application/json:
          schema:
            $ref: "../schemas/note.yaml#/Note"
    '400':
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: The caller may not create notes in this workspace
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
