get:
  operationId: getNote
  summary: Get a single note by id (caller must belong to its workspace)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: The requested note
      content:
        application/json:
          schema:
            $ref: "../schemas/note.yaml#/Note"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: The caller is not allowed to access this note
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
put:
  operationId: updateNote
  summary: Update a note (owner or editor only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/note.yaml#/UpdateNoteRequest"
  responses:
    '200':
      description: The updated note
      content:
        application/json:
          schema:
            $ref: "../schemas/note.yaml#/Note"
    '400':
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: The caller may not update this note
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
delete:
  operationId: deleteNote
  summary: Move a note to the trash (owner or editor only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: Note moved to the trash
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: The caller may not delete this note
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
