delete:
  operationId: unshareNote
  summary: Remove a user's access to a shared note (owner only)
  security:
    - BearerAuth: [ ]
  tags:
    - V1Notes
  parameters:
    - name: id
      in: path
      required: true
      description: Unique identifier of the note
      schema:
        type: string
    - name: userId
      in: path
      required: true
      description: Identifier of the user whose share should be removed
      schema:
        type: string
  responses:
    '204':
      description: Share removed
    '401':
      description: No valid JWT authentication token was provided
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '403':
      description: Only the owner may unshare the note
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
    '404':
      description: No note or share with the specified id was found
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error-response.yaml#/ErrorResponse"
