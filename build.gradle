plugins {
  id 'java'
  id 'groovy'
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'org.openapi.generator' version '7.7.0'
  id 'jacoco'
}

group = 'com.notetaker'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

ext {
  set('basePackage', 'com.notetaker')
  springdocVersion = '2.8.5'
  mapstructVersion = '1.5.5.Final'
}

springBoot {
  buildInfo()
}

repositories {
  mavenCentral()
}

dependencies {
  // Spring Boot
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // Security: OAuth2 resource server validates OKTA (NoteTaker-UI) and the self/bypass issuer JWTs
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  implementation 'com.nimbusds:nimbus-jose-jwt'

  // Caffeine backs both the refresh-ahead JWKS cache and the validated-token keychain
  implementation 'com.github.ben-manes.caffeine:caffeine'

  // Persistence
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.oracle.database.jdbc:ojdbc11:21.11.0.0'
  implementation 'org.liquibase:liquibase-core'

  // OpenAPI: generated interfaces + Swagger UI
  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
  implementation 'io.swagger.core.v3:swagger-core-jakarta:2.2.22'
  implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
  implementation 'jakarta.annotation:jakarta.annotation-api'
  implementation 'jakarta.validation:jakarta.validation-api'

  // Mapping + boilerplate
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

  // Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

  // Spock (Groovy) - unit + component specifications
  testImplementation platform('org.spockframework:spock-bom:2.4-M4-groovy-4.0')
  testImplementation 'org.spockframework:spock-core'
  testImplementation 'org.spockframework:spock-spring'
  testImplementation 'org.apache.groovy:groovy:4.0.22'
}

openApiGenerate {
  generatorName = 'spring'
  inputSpec = "$rootDir/openapi/api-spec.yaml"
  outputDir = "$buildDir/generated/open-api"
  apiPackage = "${basePackage}.api"
  invokerPackage = "${basePackage}"
  modelPackage = "${basePackage}.model"
  configOptions.putAll([
      performBeanValidation               : 'true',
      useBeanValidation                   : 'true',
      delegatePattern                     : 'true',
      useSpringBoot3                       : 'true',
      useTags                             : 'true',
      generatedConstructorWithRequiredArgs: 'false',
      additionalModelTypeAnnotations      : '@lombok.Builder' +
          '\n@lombok.NoArgsConstructor' +
          '\n@lombok.AllArgsConstructor' +
          '\n@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)',
      dateLibrary                         : 'custom'
  ])
  additionalProperties = [
      removeEnumValuePrefix: false
  ]
  typeMappings.putAll([
      'DateTime': 'Instant',
      'date'    : 'LocalDate'
  ])
  importMappings.putAll([
      'Instant'  : 'java.time.Instant',
      'LocalDate': 'java.time.LocalDate'
  ])
}

sourceSets {
  main {
    java {
      srcDir "${buildDir.absolutePath}/generated/open-api/src/main/java"
    }
  }
}

compileJava {
  dependsOn tasks.openApiGenerate
}

tasks.named('test') {
  useJUnitPlatform()
  testLogging {
    showStandardStreams = true
  }
  finalizedBy jacocoTestReport
}

jacocoTestReport {
  dependsOn test
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
          'org/openapitools/configuration/**',
          'com/notetaker/OpenApiGeneratorApplication.class',
          'com/notetaker/RFC3339DateFormat.class',
          'com/notetaker/model/**',
          'com/notetaker/api/**'
      ])
    }))
  }
  reports {
    xml.required = false
    csv.required = false
  }
}
